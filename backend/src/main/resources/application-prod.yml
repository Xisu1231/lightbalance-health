spring:
  datasource:
    url: jdbc:h2:mem:health_balance;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: false

app:
  cors-origin: ${APP_CORS_ORIGIN:https://lightbalance-health.onrender.com}

logging:
  level:
    root: INFO
    com.lightbalance.health: INFO
    org.hibernate.SQL: WARN
